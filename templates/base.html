<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Coda&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<nav class="nav10">
    <div class="nav10_desktop">
        <a href="{{ url_for('views.home') }}" class="nav_logo">Album Shop<span>.</span></a>
        <ul class="nav10_links">
            <li><a href="{{ url_for('views.records') }}">Records</a></li>
            <li><a href="{{ url_for('views.favourite_list') }}">Favourites</a></li>
            <li><a href="{{ url_for('views.account') }}">Profile</a></li>
            <li><a href="{{ url_for('views.register') }}">Sign Up</a></li>
            <li><a href="{{ url_for('views.login') }}">Log in</a></li>
            <li><a href="{{ url_for('views.logout') }}">Log Out</a></li>
        </ul>
    </div>
</nav>

<section class="tcl-11">
    <div class="tcl-11__paper">
        {% block content %}
        {% endblock %}
    </div>
</section>
</body>
</html>
